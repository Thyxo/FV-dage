name: Byg Windows-installer

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Byg sidecar (Node SEA)
        working-directory: sidecar
        run: |
          npm ci
          node build.mjs

      - name: Byg app og installer
        run: npx --yes @tauri-apps/cli@2.12.4 build

      - uses: actions/upload-artifact@v4
        with:
          name: CellKeeper-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Hvert push til main bliver en ny release med installeren vedhæftet.
      - name: Lav release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          notes=$(git log -1 --pretty=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:')
          gh release create "$tag" src-tauri/target/release/bundle/nsis/*.exe \
            --target "$GITHUB_SHA" \
            --title "CellKeeper ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "$notes" \
            --latest
